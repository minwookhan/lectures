<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강의 자료</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='8' y='8' width='16' height='16' rx='3' transform='rotate(45 16 16)' fill='%235e6ad2'/></svg>">
</head>
<body>
  <div class="app" id="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <span class="dot"></span>
        <span>lectures</span>
      </div>
      <nav class="sidebar__nav" id="nav" aria-label="강의 목록">
        <!-- toc.json 로드 후 채워짐 -->
      </nav>
    </aside>

    <!-- Header -->
    <header class="header">
      <button class="header__toggle" id="toggleBtn" aria-label="사이드바 토글" title="사이드바 토글 ([ 또는 \)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="header__crumbs" id="crumbs">
        <span class="current">강의 자료</span>
      </div>

      <div class="header__search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="search" placeholder="제목·태그 검색" autocomplete="off">
        <kbd>/</kbd>
      </div>

      <div class="header__actions">
        <button class="icon-btn" id="themeBtn" aria-label="테마 전환" title="테마 전환">
          <svg id="themeIconLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg id="themeIconDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <a class="icon-btn" href="admin/" aria-label="admin" title="관리 페이지">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </a>
      </div>
    </header>

    <!-- Main -->
    <main class="main">
      <div class="main__welcome" id="welcome">
        <div class="welcome">
          <div class="welcome__mark"><span class="dot"></span></div>
          <h1>강의 자료</h1>
          <p>왼쪽 사이드바에서 강의를 선택하면 이 영역에 표시됩니다. 매주 새로운 자료는 <a href="admin/">관리 페이지</a>에서 업로드합니다.</p>
          <div class="welcome__keys">
            <div class="row"><kbd>[</kbd><span>사이드바 토글</span></div>
            <div class="row"><kbd>\</kbd><span>사이드바 토글</span></div>
            <div class="row"><kbd>/</kbd><span>검색 포커스</span></div>
            <div class="row"><kbd>Esc</kbd><span>검색 지우기</span></div>
          </div>
        </div>
      </div>
      <iframe class="main__frame" id="frame" style="display:none" title="강의 본문" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads"></iframe>
    </main>

  </div>

  <div class="toast" id="toast"></div>

  <script src="assets/app.js"></script>
</body>
</html>
